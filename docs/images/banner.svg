<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">ParaLate</title>
  <desc id="desc">ParaLate: read any PDF side by side with its translation. The original page is shown on the left and the translated page on the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.6" stop-color="#141A3D"/>
      <stop offset="1" stop-color="#2A1B5E"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="490" y2="0">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000010" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="22"/></clipPath>
    <clipPath id="imgclip"><rect x="22" y="130" width="162" height="58" rx="7"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="1010" cy="70" r="190" fill="#7C5CFF" opacity="0.38" filter="url(#blur)"/>
    <circle cx="180" cy="430" r="170" fill="#2F6BFF" opacity="0.32" filter="url(#blur)"/>

    <!-- Left: wordmark and tagline -->
    <text x="76" y="112" font-size="15" font-weight="700" letter-spacing="5" fill="#7FA8FF">DESKTOP PDF TRANSLATOR</text>
    <text x="72" y="214" font-size="96" font-weight="800" letter-spacing="-2"><tspan fill="#FFFFFF">Para</tspan><tspan fill="url(#accent)">Late</tspan></text>
    <text x="76" y="268" font-size="28" fill="#D5DBFA">Read any PDF side by side with its translation.</text>
    <text x="76" y="304" font-size="18" fill="#8F9BCB">Original on the left. Translation on the right. Layout intact.</text>

    <g font-size="14" font-weight="600" text-anchor="middle" fill="#DDE3FF">
      <rect x="76" y="338" width="150" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="151" y="361">Windows 10 / 11</text>
      <rect x="238" y="338" width="172" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="324" y="361">PyQt6 + PyMuPDF</text>
      <rect x="422" y="338" width="108" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="476" y="361">GPL-3.0</text>
    </g>

    <!-- Right: two-page spread -->
    <g filter="url(#shadow)">
      <rect x="790" y="62" width="206" height="276" rx="10" fill="#F4F6FF"/>
      <rect x="1010" y="62" width="206" height="276" rx="10" fill="#F6F2FF"/>
    </g>

    <!-- Original page -->
    <g transform="translate(790,62)">
      <rect x="22" y="24" width="118" height="13" rx="4" fill="#2B3566"/>
      <rect x="22" y="44" width="70" height="6" rx="3" fill="#8E99CC"/>
      <g fill="#C3CBE8">
        <rect x="22" y="68" width="162" height="6" rx="3"/>
        <rect x="22" y="82" width="150" height="6" rx="3"/>
        <rect x="22" y="96" width="162" height="6" rx="3"/>
        <rect x="22" y="110" width="128" height="6" rx="3"/>
      </g>
      <rect x="22" y="130" width="162" height="58" rx="7" fill="url(#img)"/>
      <g clip-path="url(#imgclip)">
        <circle cx="52" cy="152" r="9" fill="#FFFFFF" opacity="0.85"/>
        <path d="M22 188 L78 150 L112 172 L140 156 L184 188 Z" fill="#FFFFFF" opacity="0.28"/>
      </g>
      <rect x="20" y="203" width="108" height="14" rx="3" fill="#FFE27A" opacity="0.85"/>
      <rect x="22" y="207" width="104" height="6" rx="3" fill="#7A86B8"/>
      <g fill="#C3CBE8">
        <rect x="22" y="224" width="162" height="6" rx="3"/>
        <rect x="22" y="238" width="140" height="6" rx="3"/>
        <rect x="22" y="252" width="88" height="6" rx="3"/>
      </g>
      <text x="103" y="270" text-anchor="middle" font-size="11" fill="#98A1C7">1</text>
    </g>

    <!-- Translated page -->
    <g transform="translate(1010,62)">
      <rect x="22" y="24" width="132" height="13" rx="4" fill="#4A2E9E"/>
      <rect x="22" y="44" width="84" height="6" rx="3" fill="#A98BE0"/>
      <g fill="#D3C7F5">
        <rect x="22" y="68" width="162" height="6" rx="3"/>
        <rect x="22" y="82" width="162" height="6" rx="3"/>
        <rect x="22" y="96" width="148" height="6" rx="3"/>
        <rect x="22" y="110" width="162" height="6" rx="3"/>
      </g>
      <rect x="22" y="130" width="162" height="58" rx="7" fill="url(#img)"/>
      <g clip-path="url(#imgclip)">
        <circle cx="52" cy="152" r="9" fill="#FFFFFF" opacity="0.85"/>
        <path d="M22 188 L78 150 L112 172 L140 156 L184 188 Z" fill="#FFFFFF" opacity="0.28"/>
      </g>
      <rect x="20" y="203" width="118" height="14" rx="3" fill="#FFE27A" opacity="0.85"/>
      <rect x="22" y="207" width="114" height="6" rx="3" fill="#8F6FD6"/>
      <g fill="#D3C7F5">
        <rect x="22" y="224" width="162" height="6" rx="3"/>
        <rect x="22" y="238" width="152" height="6" rx="3"/>
        <rect x="22" y="252" width="104" height="6" rx="3"/>
      </g>
      <text x="103" y="270" text-anchor="middle" font-size="11" fill="#A99BD0">2</text>
    </g>

    <text x="893" y="372" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="4" fill="#7FA8FF">ORIGINAL</text>
    <text x="1113" y="372" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="4" fill="#B88CFF">TRANSLATION</text>
  </g>
</svg>
