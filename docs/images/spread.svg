<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Interleaved PDF and two-page spread</title>
  <desc id="desc">A translated document is one PDF with pages stored as Original 1, Translation 1, Original 2, Translation 2 and so on. The ParaLate viewer shows each pair as a spread, original on the left and translation on the right, in a single scroll area.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000010" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1098" height="558" rx="20" fill="#0E1330" stroke="#2A3369" stroke-width="2"/>

  <text x="44" y="52" font-size="20" font-weight="700" fill="#FFFFFF">One PDF, two columns</text>
  <text x="44" y="78" font-size="14" fill="#8F9BCB">Pages are stored interleaved and shown as a spread: original on the left, translation on the right.</text>

  <!-- Physical page order -->
  <g filter="url(#shadow)">
    <!-- spread 1 -->
    <rect x="167" y="104" width="104" height="140" rx="8" fill="#EEF1FF"/>
    <rect x="281" y="104" width="104" height="140" rx="8" fill="#E6DBFF"/>
    <!-- spread 2 -->
    <rect x="441" y="104" width="104" height="140" rx="8" fill="#EEF1FF"/>
    <rect x="555" y="104" width="104" height="140" rx="8" fill="#E6DBFF"/>
    <!-- spread 3 -->
    <rect x="715" y="104" width="104" height="140" rx="8" fill="#EEF1FF"/>
    <rect x="829" y="104" width="104" height="140" rx="8" fill="#E6DBFF"/>
  </g>

  <!-- page contents: heading bars -->
  <g fill="#2B3566">
    <rect x="183" y="120" width="52" height="8" rx="3"/>
    <rect x="457" y="120" width="52" height="8" rx="3"/>
    <rect x="731" y="120" width="52" height="8" rx="3"/>
  </g>
  <g fill="#4A2E9E">
    <rect x="297" y="120" width="52" height="8" rx="3"/>
    <rect x="571" y="120" width="52" height="8" rx="3"/>
    <rect x="845" y="120" width="52" height="8" rx="3"/>
  </g>

  <!-- page contents: body lines -->
  <g fill="#C3CBE8">
    <rect x="183" y="190" width="72" height="5" rx="2.5"/><rect x="183" y="202" width="60" height="5" rx="2.5"/><rect x="183" y="214" width="72" height="5" rx="2.5"/>
    <rect x="457" y="190" width="72" height="5" rx="2.5"/><rect x="457" y="202" width="60" height="5" rx="2.5"/><rect x="457" y="214" width="72" height="5" rx="2.5"/>
    <rect x="731" y="190" width="72" height="5" rx="2.5"/><rect x="731" y="202" width="60" height="5" rx="2.5"/><rect x="731" y="214" width="72" height="5" rx="2.5"/>
  </g>
  <g fill="#D3C7F5">
    <rect x="297" y="190" width="72" height="5" rx="2.5"/><rect x="297" y="202" width="72" height="5" rx="2.5"/><rect x="297" y="214" width="58" height="5" rx="2.5"/>
    <rect x="571" y="190" width="72" height="5" rx="2.5"/><rect x="571" y="202" width="72" height="5" rx="2.5"/><rect x="571" y="214" width="58" height="5" rx="2.5"/>
    <rect x="845" y="190" width="72" height="5" rx="2.5"/><rect x="845" y="202" width="72" height="5" rx="2.5"/><rect x="845" y="214" width="58" height="5" rx="2.5"/>
  </g>

  <!-- page labels -->
  <g font-size="22" font-weight="800" text-anchor="middle">
    <g fill="#2B3566">
      <text x="219" y="166">Orig 1</text>
      <text x="493" y="166">Orig 2</text>
      <text x="767" y="166">Orig 3</text>
    </g>
    <g fill="#4A2E9E">
      <text x="333" y="166">Trans 1</text>
      <text x="607" y="166">Trans 2</text>
      <text x="881" y="166">Trans 3</text>
    </g>
  </g>

  <!-- spread brackets -->
  <g fill="none" stroke="#5B6CC9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M167 262 V270 H385 V262"/>
    <path d="M441 262 V270 H659 V262"/>
    <path d="M715 262 V270 H933 V262"/>
  </g>
  <g text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#C9D3FF">
      <text x="276" y="294">Spread 1</text>
      <text x="550" y="294">Spread 2</text>
      <text x="824" y="294">Spread 3</text>
    </g>
    <g font-size="12" fill="#8F9BCB">
      <text x="276" y="312">pages 1 + 2</text>
      <text x="550" y="312">pages 3 + 4</text>
      <text x="824" y="312">pages 5 + 6</text>
    </g>
  </g>

  <!-- arrow -->
  <path d="M550 322 V342 M542 334 L550 342 L558 334" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="337" font-size="12" fill="#8F9BCB">rendered by the ParaLate viewer</text>

  <!-- Viewer window -->
  <rect x="170" y="356" width="760" height="160" rx="12" fill="#161C42" stroke="#2F3A78"/>
  <rect x="170" y="356" width="760" height="30" rx="12" fill="#1D2554"/>
  <rect x="170" y="372" width="760" height="14" fill="#1D2554"/>
  <circle cx="192" cy="371" r="5" fill="#FF6B6B"/>
  <circle cx="208" cy="371" r="5" fill="#FFC857"/>
  <circle cx="224" cy="371" r="5" fill="#5AD17A"/>
  <text x="550" y="376" text-anchor="middle" font-size="13" fill="#AEB9E8">ParaLate Viewer</text>

  <rect x="186" y="398" width="350" height="106" rx="6" fill="#EEF1FF"/>
  <rect x="544" y="398" width="350" height="106" rx="6" fill="#E6DBFF"/>
  <rect x="904" y="398" width="8" height="106" rx="4" fill="#232C63"/>
  <rect x="904" y="410" width="8" height="34" rx="4" fill="#5B6CC9"/>

  <rect x="196" y="406" width="82" height="18" rx="9" fill="#2B3566"/>
  <text x="237" y="419" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">ORIGINAL</text>
  <rect x="554" y="406" width="122" height="18" rx="9" fill="#4A2E9E"/>
  <text x="615" y="419" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">TRANSLATION</text>

  <g fill="#C3CBE8">
    <rect x="198" y="438" width="310" height="6" rx="3"/>
    <rect x="198" y="452" width="290" height="6" rx="3"/>
    <rect x="198" y="466" width="310" height="6" rx="3"/>
    <rect x="198" y="480" width="236" height="6" rx="3"/>
  </g>
  <g fill="#D3C7F5">
    <rect x="556" y="438" width="310" height="6" rx="3"/>
    <rect x="556" y="452" width="310" height="6" rx="3"/>
    <rect x="556" y="466" width="284" height="6" rx="3"/>
    <rect x="556" y="480" width="262" height="6" rx="3"/>
  </g>

  <text x="550" y="542" text-anchor="middle" font-size="12" fill="#8F9BCB">One scroll area: both pages scroll together.</text>
</svg>
